services:
  - type: web
    name: public-waste-collection-monitoring-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
    disk:
      name: public-waste-collection-data
      mountPath: /var/data
      sizeGB: 1
