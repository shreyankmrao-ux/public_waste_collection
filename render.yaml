services:
  - type: web
    name: public-waste-collection-monitoring-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
