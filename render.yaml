services:
  - type: web
    name: public-waste-collection-monitoring-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    disk:
      name: public-waste-collection-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: LEGACY_DATABASE_PATH
        value: /var/data/database.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: public_waste_collection
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
